<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EchoCert Lite</title>
<style>
body{font-family:Arial,sans-serif;margin:30px;max-width:900px}textarea,input{width:100%;padding:10px;margin:8px 0}textarea{height:120px}button{padding:10px;margin:5px}pre{background:#eee;padding:10px;white-space:pre-wrap}code{word-break:break-all}
</style>
</head>
<body>
<h1>EchoCert Lite</h1>
<p>Paste an AI prompt and output. This page creates a local receipt and SHA-256 hash in your browser.</p>
<label>Label</label>
<input id="label" placeholder="Case label">
<label>Prompt</label>
<textarea id="prompt"></textarea>
<label>AI Output</label>
<textarea id="output"></textarea>
<button onclick="makeReceipt()">Generate Receipt</button>
<button onclick="download('receipt.json', receiptText)">Download Receipt</button>
<button onclick="download('audit_report.html', reportHtml)">Download HTML Report</button>
<button onclick="window.print()">Print / Save PDF</button>
<h2>Status</h2>
<p id="status">No receipt yet.</p>
<p><b>SHA-256:</b> <code id="hash"></code></p>
<h2>Receipt</h2>
<pre id="receipt"></pre>
<script>
let receiptText='';
let reportHtml='';
async function sha256(text){
 const data=new TextEncoder().encode(text);
 const buf=await crypto.subtle.digest('SHA-256',data);
 return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeReceipt(){
 const obj={
  prompt:document.getElementById('prompt').value,
  output:document.getElementById('output').value,
  metadata:{tool:'EchoCert Lite',timestamp_utc:new Date().toISOString(),label:document.getElementById('label').value,non_claims:['no_truth_proof','no_legal_advice','no_model_introspection']}
 };
 receiptText=JSON.stringify(obj,Object.keys(obj).sort(),2);
 const hash=await sha256(receiptText);
 document.getElementById('hash').textContent=hash;
 document.getElementById('status').textContent='Receipt generated locally. Save the receipt and hash together.';
 document.getElementById('receipt').textContent=receiptText;
 reportHtml='<!doctype html><html><head><meta charset="utf-8"><title>EchoCert Audit Report</title></head><body><h1>EchoCert Audit Report</h1><p><b>SHA-256:</b> '+hash+'</p><p><b>Generated:</b> '+new Date().toISOString()+'</p><h2>Prompt</h2><pre>'+escapeHtml(obj.prompt)+'</pre><h2>AI Output</h2><pre>'+escapeHtml(obj.output)+'</pre><h2>Limit</h2><p>This report records evidence integrity only. It does not prove truth or replace professional advice.</p></body></html>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function download(name,text){
 if(!text){alert('Generate receipt first');return;}
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
 a.download=name;
 a.click();
}
</script>
</body>
</html>
